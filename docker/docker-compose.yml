# Run a PurePrivacy box in one command:  docker compose up -d  &&  docker compose logs -f
# The box is reached only via its .onion (outbound Tor). The ONE published port is the
# first-run web setup page, bound to the HOST's 127.0.0.1 only (never the LAN) and dead
# once your phone has signed in. A named volume holds the box's identity (onion key, admin,
# secrets, pairings).
services:
  box:
    image: ${PP_IMAGE:-pureprivacy-box:dev}   # ./build.sh builds :dev; or PP_IMAGE=jaimemelon/pureprivacy-box:latest to pull from Docker Hub
    container_name: pureprivacy-box
    restart: unless-stopped
    environment:
      # Only needed for the scripted path (with PP_PASS). In the default web-setup flow you
      # choose the username in the browser, so leave this unset.
      PP_USER: "${PP_USER:-}"
      # Leave PP_PASS unset (default) for the interactive web-setup flow: open the setup
      # page (below) in your browser, choose a username + password, scan the QR. Set PP_PASS
      # to provision non-interactively instead (CI / scripted).
      PP_PASS: "${PP_PASS:-}"
      PP_BOX:  "${PP_BOX:-mybox}"
      # Stable key so secrets.json decrypts across restarts. Optional — a non-secret default
      # is used if unset. For a real box, generate + keep one:  PP_SECRETS_KEY=$(openssl rand -base64 32)
      PP_SECRETS_KEY: "${PP_SECRETS_KEY:-}"
    ports:
      # One-page web setup — HOST loopback only. On first run open http://127.0.0.1:8470/
      # in your browser. Closes itself once your phone signs in.
      - "127.0.0.1:8470:8470"
    volumes:
      - pp-data:/data
      # Credential handoff. Mounted on BOTH sides because the box is the writer (it holds
      # the registration token) and the agent is the reader. Harmless when agents aren't
      # installed — it's just an empty dir; the box detects the add-on by probing the
      # agent's loopback port, not by this mount existing.
      - pp-agent-handoff:/handoff

  # ── Agents (optional add-on) ────────────────────────────────────────────────────────
  # A SEPARATE image, behind a compose profile, so a plain box stays a plain box: without
  # `--profile agents` this service is never created and nothing here is pulled. Choose it
  # at install time (`pp-box init`) or turn it on later (`pp-box agents on`).
  #
  # Why it can only be enabled from the HOST: the box is itself a container, so starting a
  # sibling would need /var/run/docker.sock — i.e. root on the host. Installing software is
  # deliberately a host action; the phone's one-tap setup then provisions the agent that
  # this service runs.
  agent:
    image: ${PP_AGENT_IMAGE:-pureprivacy-agent:dev}
    container_name: pureprivacy-agent
    profiles: ["agents"]
    restart: unless-stopped
    # Share the BOX's network namespace: the agent reaches tuwunel on 127.0.0.1:8118 and
    # tor's SOCKS on 127.0.0.1:9150 with NO new port exposure, and its WebUI on
    # 127.0.0.1:8787 lands on the box's loopback where tor can map a client-authorised
    # onion port onto it. It also stops the agent taking a Tor circuit to reach the box
    # sitting next to it. Consequence: this service has no ports/networks of its own, and
    # it dies when the box container is recreated — hence `pp-box update` recreates both.
    network_mode: "service:box"
    depends_on:
      - box
    volumes:
      - pp-agent-data:/data
      # Credential handoff: the box provisions the agent's Matrix account and drops it
      # here; the agent picks it up and starts its gateway. Secrets never ride account-data.
      - pp-agent-handoff:/handoff

volumes:
  pp-data:
    # Per-install volume name. `pp-box init` generates a unique one into .env (PP_VOLUME) so
    # two boxes on one host can't collide. It must stay STABLE for the life of the box — this
    # volume holds the onion key; pointing at a different name = a new, empty box.
    # Existing installs (no PP_VOLUME in .env) keep the original name, so nothing is orphaned.
    name: ${PP_VOLUME:-pureprivacy-data}
  pp-agent-data:
    # The agent's own state: profiles (= the agents themselves), sessions, memories, skills,
    # and ~/.hermes/.env with the model API keys. SECRET MATERIAL — and note `pp-box backup`
    # currently tars only the box's volume, so this is NOT yet covered by it.
    name: ${PP_AGENT_VOLUME:-pureprivacy-agent-data}
  pp-agent-handoff:
    name: ${PP_AGENT_HANDOFF_VOLUME:-pureprivacy-agent-handoff}
